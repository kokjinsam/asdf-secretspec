name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run offline tests
        run: bash tests/plugin.bash
      - name: Set up asdf
        uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
        with:
          asdf_version: 0.16.5
      - name: Test asdf installation
        shell: bash
        run: |
          asdf plugin add secretspec "$GITHUB_WORKSPACE"
          asdf install secretspec 0.21.1
          asdf reshim secretspec 0.21.1
          test "$(ASDF_SECRETSPEC_VERSION=0.21.1 asdf exec secretspec --version)" = "secretspec 0.21.1"
