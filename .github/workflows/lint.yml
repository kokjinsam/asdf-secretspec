name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read tool versions
        id: tools
        run: |
          echo "shellcheck=v$(awk '$1 == "shellcheck" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "shfmt=$(awk '$1 == "shfmt" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: ${{ steps.tools.outputs.shellcheck }}
          check_together: 'true'
      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4
        with:
          shfmt-version: ${{ steps.tools.outputs.shfmt }}
      - run: shfmt -d bin lib scripts tests
